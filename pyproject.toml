[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-rsi-lab"
version = "0.1.0"
description = "Point-in-time A-share agent research and regression harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stock-rsi = "stock_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

