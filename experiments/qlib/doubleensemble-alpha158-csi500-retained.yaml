# DEVELOPMENT ONLY: every data segment ends before 2026; do not add a 2026 segment.
qlib_init:
  provider_uri: ~/.qlib/qlib_data/cn_data
  region: cn
market: csi500
benchmark: SH000905
data_handler_config: &id001
  start_time: 2016-01-04
  end_time: 2025-12-30
  fit_start_time: 2016-01-04
  fit_end_time: 2021-12-31
  instruments: csi500
port_analysis_config: &id002
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 100
      n_drop: 2
  backtest:
    start_time: 2024-01-02
    end_time: 2025-12-30
    account: 100000000
    benchmark: SH000905
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: DEnsembleModel
    module_path: qlib.contrib.model.double_ensemble
    kwargs:
      base_model: gbm
      loss: mse
      num_models: 3
      enable_sr: true
      enable_fs: true
      alpha1: 1
      alpha2: 1
      bins_sr: 10
      bins_fs: 5
      decay: 0.5
      sample_ratios:
      - 0.8
      - 0.7
      - 0.6
      - 0.5
      - 0.4
      sub_weights:
      - 1
      - 1
      - 1
      epochs: 28
      colsample_bytree: 0.8879
      learning_rate: 0.2
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 8
      verbosity: -1
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs: *id001
      segments:
        train:
        - 2016-01-04
        - 2021-12-31
        valid:
        - 2022-01-04
        - 2023-12-29
        test:
        - 2024-01-02
        - 2025-12-30
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 242
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
